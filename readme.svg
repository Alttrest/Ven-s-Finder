          <text x="14" y="48" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">DuckDuckGo Direct</text>
        </g>
        
        <g transform="translate(310, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">PRIVACY</text>
          <text x="14" y="48" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Zero Search Logs</text>
        </g>
        
    </g>

    <!-- Detailed Highlights -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700">CORE SYSTEM ARCHITECTURE:</text>
      
        <text x="0" y="22" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Smart multi-angle query generation utilizing Groq LLaMA 3...</text>
        
        <text x="0" y="42" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Real-time extraction and synthesis of open-web digital br...</text>
        
        <text x="0" y="62" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Structured persona report generation with zero tracking o...</text>
        
    </g>
  </g>

  <!-- Right Column: Bespoke Visual Representation -->
  <g transform="translate(680, 50)">
    
        <g transform="translate(60, 20)">
          <circle cx="170" cy="160" r="140" fill="none" stroke="#2e1065" stroke-width="1.5"/>
          <circle cx="170" cy="160" r="95" fill="none" stroke="#4c1d95" stroke-width="1.5"/>
          <circle cx="170" cy="160" r="50" fill="none" stroke="#6b21a8" stroke-width="1.5"/>
          
          <line x1="170" y1="20" x2="170" y2="300" stroke="#3b0764" stroke-width="1"/>
          <line x1="30" y1="160" x2="310" y2="160" stroke="#3b0764" stroke-width="1"/>

          <!-- Radar Sweep -->
          <path d="M 170 160 L 305 160 A 140 140 0 0 0 270 65 Z" fill="#c084fc" opacity="0.15"/>
          <line x1="170" y1="160" x2="305" y2="160" stroke="#a855f7" stroke-width="2"/>

          <!-- Match Blips -->
          <circle cx="230" cy="110" r="4.5" fill="#38bdf8" class="pulse-elem"/>
          <text x="240" y="113" fill="#38bdf8" font-family="monospace" font-size="9">GITHUB MATCH</text>

          <circle cx="100" cy="200" r="4.5" fill="#00f2fe" class="pulse-elem"/>
          <text x="45" y="203" fill="#00f2fe" font-family="monospace" font-size="9">LINKEDIN</text>

          <circle cx="210" cy="230" r="4.5" fill="#10b981" class="pulse-elem"/>
          <text x="220" y="233" fill="#10b981" font-family="monospace" font-size="9">DNS RECORD</text>
        </g>
        
