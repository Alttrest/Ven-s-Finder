<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .grid-bg { fill: url(#grid); }
    .pulse-elem { animation: pulse 2.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="560" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="560" rx="16" class="grid-bg" />

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect width="200" height="26" rx="13" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#c084fc" />
    <text x="28" y="17" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700">OSINT SEARCH ENGINE</text>
  </g>

  <!-- Left Column: Project Identity & Specs -->
  <g transform="translate(60, 115)">
    <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">Ven&#x27;s Finder</text>
    <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">AI-Powered Open-Source Person &amp; Digital Dossier Search Engine</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 100)">
      
        <rect x="0" y="0" width="87" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="43" y="19" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">Groq AI</text>
        
        <rect x="99" y="0" width="105" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="151" y="19" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="12" font-weight="600">LLaMA 3.1</text>
        
        <rect x="216" y="0" width="114" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="273" y="19" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12" font-weight="600">DuckDuckGo</text>
        
        <rect x="342" y="0" width="87" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="385" y="19" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="600">Node.js</text>
        
    </g>

    <!-- Metrics Cards -->
    <g transform="translate(0, 160)">
      
        <g transform="translate(0, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">EXPANDER</text>
          <text x="14" y="48" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">6 Query Angles</text>
        </g>
        
        <g transform="translate(155, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
